name: smart_day_planner
description: Offline AI-first daily planner for Android and iOS.
publish_to: "none"
version: 0.2.5+8

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  shamsi_date: ^1.0.2
  crypto: ^3.0.5
  encrypt: ^5.0.3
  device_calendar: ^4.3.3
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  flutter_riverpod: ^2.5.1
  # FFI برای اتصال به شیم C (llm_shim.c) و llama.cpp — LLM محلی اختیاری
  ffi: ^2.1.4
  # تشخیص گفتار آفلاین (Vosk) — اختیاری، با ENABLE_OFFLINE_SPEECH=true فعال می‌شود
  vosk_flutter: ^0.3.48
  # استخراج مدل‌های zip Vosk از دایرکتوری اسناد
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # برای اجرای ریپوهای sqflite در تست‌های VM (flutter test)
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Vazirmatn-Regular.ttf
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
  # بعداً اگر مدل LLM محلی اضافه کردی، فایل مدل را اینجا asset کن:
  # assets:
  #   - assets/models/tinyllama-q4.gguf
