name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle

jobs:
  release-build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # پوشهٔ android/ در ریپو نسخه‌دار است (با Manifest و jniLibs کامل)
      # بنابراین flutter create اجرا نمی‌شود تا تنظیمات سفارشی بازنویسی نشود.

      - name: Clean up auto-generated widget_test
        run: |
          echo "=== Checking for auto-generated widget_test.dart ==="
          ls -la test/ 2>&1 | head -n 30
          if [ -f test/widget_test.dart ]; then
            echo "Found test/widget_test.dart:"
            cat test/widget_test.dart 2>&1 | head -n 30
            if grep -q "MyApp" test/widget_test.dart 2>&1; then
              echo "Removing conflicting auto-generated widget_test.dart"
              rm -f test/widget_test.dart
              echo "Removed"
            else
              echo "Keeping widget_test.dart (no MyApp conflict)"
            fi
          else
            echo "No widget_test.dart found"
          fi

      # امضای release با کلید واقعی از GitHub Secrets.
      # اگر Secrets تنظیم نشده باشند، مرحلهٔ build release با خطای واضح
      # متوقف می‌شود (gradle: «key.properties یافت نشد»).
      - name: Setup release signing (from Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 تنظیم نشده است — بیلد release بدون کلید امضا متوقف می‌شود."
            echo "برای رفع: Settings → Secrets and variables → Actions و تنظیم ۴ سکرت زیر:"
            echo "  KEYSTORE_BASE64 (خروجی base64 از فایل .jks)"
            echo "  KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF
          echo "key.properties ساخته شد (android/keystore.jks از Secrets)."

      - name: Get dependencies
        run: flutter pub get

      # ⚠️ خطای analyze یا تست = توقف workflow. انتشار از روی کدِ
      # شکست‌خورده مجاز نیست (قبلاً با «|| echo» نادیده گرفته می‌شد).
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build release APK (FULL - all features enabled)
        if: ${{ inputs.build_type == 'apk' }}
        run: flutter build apk --release

      - name: Build release App Bundle (FULL)
        if: ${{ inputs.build_type == 'appbundle' }}
        run: flutter build appbundle --release

      - name: Upload APK artifact
        if: ${{ inputs.build_type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: smart-day-planner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        if: ${{ inputs.build_type == 'appbundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: smart-day-planner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
