name: Flutter CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Enable Android desugaring
        run: |
          echo "=== Before patch ==="
          ls -la android/app/ 2>&1 | head -n 20
          cat android/app/build.gradle 2>&1 | head -n 150 || true
          cat android/app/build.gradle.kts 2>&1 | head -n 200 || true
          echo ""
          echo "=== Patching ==="
          python3 <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              text = groovy.read_text()
              print("Found groovy build.gradle")
              # Ensure compileOptions enables desugaring
              if "coreLibraryDesugaringEnabled" not in text:
                  text = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', text, count=1)
                  print("Added coreLibraryDesugaringEnabled true to groovy")
              elif "coreLibraryDesugaringEnabled false" in text:
                  text = text.replace("coreLibraryDesugaringEnabled false", "coreLibraryDesugaringEnabled true")
                  print("Fixed false to true in groovy")
              # Ensure dependency
              if "desugar_jdk_libs" not in text:
                  # Find dependencies block and insert
                  if "dependencies {" in text:
                      text = text.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'", 1)
                      print("Added desugar lib to groovy")
                  else:
                      # If no dependencies block, append one
                      text += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
                      print("Created dependencies block in groovy")
              groovy.write_text(text)
              print("Groovy patch done")
          else:
              print("No groovy file")

          if kotlin.exists():
              text = kotlin.read_text()
              print("Found kotlin build.gradle.kts")
              print("Original kotlin snippet:")
              print(text[:1000])
              # Ensure compileOptions enables desugaring
              if "isCoreLibraryDesugaringEnabled" not in text:
                  # Try to insert inside compileOptions
                  text = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', text, count=1)
                  print("Added isCoreLibraryDesugaringEnabled = true to kotlin")
              elif "isCoreLibraryDesugaringEnabled = false" in text:
                  text = text.replace("isCoreLibraryDesugaringEnabled = false", "isCoreLibraryDesugaringEnabled = true")
                  print("Fixed false to true in kotlin")
              # Ensure dependency - kotlin uses coreLibraryDesugaring("...")
              if "desugar_jdk_libs" not in text:
                  if "dependencies {" in text:
                      text = text.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
                      print("Added desugar lib to kotlin")
                  else:
                      text += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                      print("Created dependencies block in kotlin")
              kotlin.write_text(text)
              print("Kotlin patch done")
              print("Patched kotlin snippet:")
              print(text[:3000])
          else:
              print("No kotlin file")
          PY
          echo ""
          echo "=== After patch ==="
          cat android/app/build.gradle 2>&1 | head -n 200 || true
          cat android/app/build.gradle.kts 2>&1 | head -n 300 || true

      - name: Clean up auto-generated widget_test
        # flutter create یک test/widget_test.dart پیش‌فرض با ارجاع به MyApp تولید می‌کند
        # که با این پروژه تداخل دارد و کامپایل تست را خراب می‌کند.
        run: |
          if [ -f test/widget_test.dart ]; then
            if grep -q "MyApp" test/widget_test.dart; then
              rm -f test/widget_test.dart
              echo "Removed conflicting auto-generated widget_test.dart"
            fi
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --exclude-tags=needs-real-device

      - name: Verify feature flag gating (safe build config)
        # در بیلد امن همه قابلیت‌های پلتفرمی پرریسک خاموش هستند؛
        # این تست مطمئن می‌شود flagها واقعاً روی رفتار برنامه اثر می‌گذارند.
        run: |
          flutter test test/feature_gating_widget_test.dart \
            --dart-define=ENABLE_VOICE_INPUT=false \
            --dart-define=ENABLE_VOICE_RESPONSE=false \
            --dart-define=ENABLE_CALENDAR=false \
            --dart-define=ENABLE_PDF_EXPORT=false \
            --dart-define=ENABLE_SHARE_FILES=false \
            --dart-define=ENABLE_SMART_NOTIFICATIONS=false \
            --dart-define=ENABLE_ENCRYPTED_BACKUP=false

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=ENABLE_CALENDAR=false --dart-define=ENABLE_PDF_EXPORT=false --dart-define=ENABLE_SHARE_FILES=false --dart-define=ENABLE_SMART_NOTIFICATIONS=false

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-day-planner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
