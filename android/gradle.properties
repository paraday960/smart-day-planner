# ─── تنظیمات حافظهٔ Gradle برای محیط‌های کم‌رم ─────────────
# مهم: سیستم این پروژه ۱.۹GB RAM دارد؛ مقدار پیش‌فرض -Xmx8G باعث OOM
# و قفل شدن کامل می‌شود. این مقادیر برای اجرای امن بیلد تنظیم شده‌اند.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# دیمون gradle را بعد از هر بیلد می‌بندد تا حافظه آزاد بماند (ضد-هنگ)
org.gradle.daemon=false
# حداکثر ۲ worker همزمان (کمتر = حافظهٔ کمتر)
org.gradle.workers.max=2
# موازی‌سازی پروژه‌ها خاموش (صرفه‌جویی در حافظه)
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
